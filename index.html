<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>딥러닝 면접 노트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky toolbar, left index of categories + filters, right column of question cards (answer hidden until revealed) */
:root {
  --paper: #f4f6fb;
  --surface: #ffffff;
  --ink: #1a2031;
  --muted: #5b657a;
  --line: #dde2ec;
  --accent: #2c4bd1;
  --accent-ink: #ffffff;
  --accent-soft: #e8ecfd;
  --code-bg: #eef1f7;
  --lv-basic: #1d7656;
  --lv-basic-bg: #e3f3ec;
  --lv-deep: #a85a06;
  --lv-deep-bg: #fbeedc;
  --lv-exp: #7136b8;
  --lv-exp-bg: #f0e8fb;
  --flash: #fff4c2;
  --ty-concept: #2c4bd1;
  --ty-concept-bg: #e8ecfd;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --fs-xs: 0.75rem;
  --fs-sm: 0.875rem;
  --fs-md: 1rem;
  --fs-lg: 1.1875rem;
  --fs-xl: 1.5rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e121b; --surface: #161c29; --ink: #e5e9f3; --muted: #9ba4b9; --line: #283044;
    --accent: #8fa3ff; --accent-ink: #0e121b; --accent-soft: #1d2650; --code-bg: #1d2435;
    --lv-basic: #6fd3a9; --lv-basic-bg: #15302a; --lv-deep: #f0b25e; --lv-deep-bg: #35260f;
    --lv-exp: #c4a0f5; --lv-exp-bg: #2b1f42; --flash: #3a3414;
    --ty-concept: #8fa3ff; --ty-concept-bg: #1d2650;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e121b; --surface: #161c29; --ink: #e5e9f3; --muted: #9ba4b9; --line: #283044;
  --accent: #8fa3ff; --accent-ink: #0e121b; --accent-soft: #1d2650; --code-bg: #1d2435;
  --lv-basic: #6fd3a9; --lv-basic-bg: #15302a; --lv-deep: #f0b25e; --lv-deep-bg: #35260f;
  --lv-exp: #c4a0f5; --lv-exp-bg: #2b1f42; --flash: #3a3414;
  --ty-concept: #8fa3ff; --ty-concept-bg: #1d2650;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--fs-md);
  line-height: 1.7;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--surface);
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- toolbar ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.bar-inner, .wrap {
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar-inner {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  padding-block: 12px;
}
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { margin: 0; font-size: var(--fs-lg); font-weight: 700; letter-spacing: -0.01em; }
.brand .count { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--muted); }
.search { position: relative; flex: 1 1 260px; max-width: 380px; }
.search input {
  width: 100%; padding: 8px 12px 8px 34px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--paper);
}
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search kbd {
  position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
  font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--muted);
  border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; line-height: 1.5;
}
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  padding: 7px 12px; cursor: pointer; font-size: var(--fs-sm); font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); color: var(--accent-ink); }

/* ---------- layout ---------- */
.wrap { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 32px; padding-block: 28px 64px; }
aside { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); align-self: start; display: grid; gap: 28px; }
.side-h {
  font-family: var(--font-mono); font-size: var(--fs-xs); text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--muted); margin: 0 0 8px;
}
.cats { display: grid; gap: 2px; }
.cat-btn {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px;
  width: 100%; text-align: left; border: 0; background: none; cursor: pointer;
  padding: 7px 10px; border-radius: 7px; font-size: var(--fs-sm);
}
.cat-btn:hover { background: var(--surface); }
.cat-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.cat-btn .n { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--muted); font-variant-numeric: tabular-nums; }
.cat-btn .prog { grid-column: 1 / -1; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.cat-btn .prog i { display: block; height: 100%; background: var(--lv-basic); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 3px 11px; font-size: var(--fs-sm); cursor: pointer;
}
.chip .n { font-family: var(--font-mono); font-size: var(--fs-xs); opacity: .75; margin-left: 2px; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.chip[aria-pressed="true"].ty-개념 { background: var(--ty-concept-bg); border-color: var(--ty-concept); color: var(--ty-concept); }
.chip[aria-pressed="true"].ty-비교 { background: var(--lv-basic-bg); border-color: var(--lv-basic); color: var(--lv-basic); }
.chip[aria-pressed="true"].ty-이유 { background: var(--lv-deep-bg); border-color: var(--lv-deep); color: var(--lv-deep); }
.chip[aria-pressed="true"].ty-경험 { background: var(--lv-exp-bg); border-color: var(--lv-exp); color: var(--lv-exp); }
.chip[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; }
.check { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); cursor: pointer; margin-top: 10px; }
.legend { font-size: var(--fs-xs); color: var(--muted); line-height: 1.6; margin: 8px 0 0; }

/* ---------- list ---------- */
main { min-width: 0; }
.status { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: var(--fs-sm); color: var(--muted); margin-bottom: 14px; }
.group-h {
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  margin: 36px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
}
.group-h:first-of-type { margin-top: 0; }
.group-h h2 { margin: 0; font-size: var(--fs-xl); font-weight: 700; letter-spacing: -0.015em; text-wrap: balance; }
.group-h a { font-size: var(--fs-sm); color: var(--muted); }
.list { display: grid; gap: 12px; }
.q {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 18px 20px; scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 96px);
  transition: background-color .6s ease;
}
.q.flash { background: var(--flash); }
.q.known .q-title { color: var(--muted); }
.q-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: var(--fs-xs); }
.qno { font-family: var(--font-mono); font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.ty { border-radius: 4px; padding: 1px 7px; font-weight: 600; }
.ty.ty-개념 { background: var(--ty-concept-bg); color: var(--ty-concept); }
.ty.ty-비교 { background: var(--lv-basic-bg); color: var(--lv-basic); }
.ty.ty-이유 { background: var(--lv-deep-bg); color: var(--lv-deep); }
.ty.ty-경험 { background: var(--lv-exp-bg); color: var(--lv-exp); }
.lv { border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; color: var(--muted); }
.lv.lv-심화 { border-color: var(--ink); color: var(--ink); font-weight: 600; }
.extra { border: 1px dashed var(--muted); border-radius: 4px; padding: 0 5px; color: var(--muted); font-size: var(--fs-xs); }
.tags { color: var(--muted); font-family: var(--font-mono); }
.q-title { margin: 8px 0 12px; font-size: var(--fs-lg); font-weight: 600; line-height: 1.5; text-wrap: balance; }
.q-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.q-actions .link { margin-left: auto; font-size: var(--fs-xs); color: var(--muted); text-decoration: none; font-family: var(--font-mono); }
.q-actions .link:hover { color: var(--accent); }
.known-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-sm); cursor: pointer; color: var(--muted); }
.known-toggle input { accent-color: var(--lv-basic); width: 16px; height: 16px; }

.answer { margin-top: 18px; display: grid; gap: 20px; }
.answer h3 {
  margin: 0 0 6px; font-family: var(--font-mono); font-size: var(--fs-xs); font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
}
.short { background: var(--accent-soft); border-radius: 8px; padding: 14px 16px; }
.short h3 { color: var(--accent); }
.md { max-width: 72ch; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol { margin: 0 0 10px; }
.md ul, .md ol { padding-left: 1.3em; }
.md li { margin: 2px 0; }
.md > ul > li + li, .md > ol > li + li { margin-top: 9px; }
.md li > ul, .md li > ol { margin: 4px 0 0; }
.md strong { font-weight: 600; }
.md code { font-family: var(--font-mono); font-size: 0.86em; background: var(--code-bg); border-radius: 4px; padding: 1px 5px; }
.md pre { background: var(--code-bg); border-radius: 8px; padding: 12px 14px; overflow-x: auto; margin: 0 0 12px; line-height: 1.55; }
.md pre code { background: none; padding: 0; font-size: 0.84rem; overflow-wrap: normal; word-break: normal; white-space: pre; }
.tablewrap { overflow-x: auto; margin: 0 0 12px; }
.md table { border-collapse: collapse; font-size: var(--fs-sm); min-width: 100%; }
.md th, .md td { border-bottom: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; font-variant-numeric: tabular-nums; }
.md th { font-weight: 600; white-space: nowrap; }
.follow { display: grid; gap: 6px; }
.follow details { border: 1px solid var(--line); border-radius: 8px; padding: 0 14px; }
.follow summary { cursor: pointer; padding: 10px 0; font-weight: 500; list-style: none; display: flex; gap: 8px; }
.follow summary::-webkit-details-marker { display: none; }
.follow summary::before { content: "＋"; color: var(--accent); font-family: var(--font-mono); flex: none; }
.follow details[open] summary::before { content: "－"; }
.follow details .md { padding-bottom: 12px; }
.src { font-size: var(--fs-xs); color: var(--muted); margin: 0; }
.src code { font-family: var(--font-mono); }

.empty, .error { padding: 40px 20px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; }
.error code { font-family: var(--font-mono); background: var(--code-bg); padding: 1px 6px; border-radius: 4px; }

/* ---------- mode tabs ---------- */
.brand { margin-right: 0; }
.modes { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); margin-right: auto; }
.mode-btn { border: 0; background: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: var(--fs-sm); font-weight: 500; color: var(--muted); white-space: nowrap; }
.mode-btn:hover { color: var(--ink); }
.mode-btn[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
.side-group { display: grid; gap: 28px; }
.toc { display: grid; gap: 2px; }
.toc-btn { text-align: left; border: 0; background: none; cursor: pointer; padding: 6px 10px; border-radius: 7px; font-size: var(--fs-sm); }
.toc-btn:hover { background: var(--surface); color: var(--accent); }

/* ---------- check types ---------- */
.ty.ty-만약에, .chip[aria-pressed="true"].ty-만약에 { background: var(--lv-deep-bg); border-color: var(--lv-deep); color: var(--lv-deep); }
.ty.ty-연결, .chip[aria-pressed="true"].ty-연결 { background: var(--lv-basic-bg); border-color: var(--lv-basic); color: var(--lv-basic); }
.ty.ty-생각해보기, .chip[aria-pressed="true"].ty-생각해보기 { background: var(--lv-exp-bg); border-color: var(--lv-exp); color: var(--lv-exp); }
.ty.ty-OX, .ty.ty-계산, .chip[aria-pressed="true"].ty-OX, .chip[aria-pressed="true"].ty-계산 { background: var(--surface); border-color: var(--muted); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.key { margin: 0 0 8px; font-weight: 600; color: var(--accent); }

/* ---------- concept note ---------- */
.note { display: grid; gap: 40px; }
.note-h .eyebrow { margin: 0 0 4px; font-family: var(--font-mono); font-size: var(--fs-xs); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.note-h h2 { margin: 0; font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.25; }
.note-h .lede { margin: 8px 0 6px; font-size: var(--fs-lg); max-width: 60ch; text-wrap: balance; }
.sec-h {
  display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px;
  margin: 0 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
  font-size: var(--fs-xl); font-weight: 700; letter-spacing: -0.015em; scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 96px);
}
.sec-h span { font-size: var(--fs-sm); font-weight: 400; color: var(--muted); letter-spacing: 0; }
.flow { list-style: none; margin: 0; padding: 0; }
.step { position: relative; display: grid; grid-template-columns: 30px minmax(0, 1fr); column-gap: 14px; padding-bottom: 16px; }
.step::before { content: ""; position: absolute; left: 14px; top: 30px; bottom: 0; width: 2px; background: var(--line); }
.step:last-child { padding-bottom: 0; }
.step:last-child::before { display: none; }
.step-no {
  position: relative; z-index: 1; width: 30px; height: 30px; border-radius: 50%;
  display: grid; place-items: center; background: var(--accent); color: var(--accent-ink);
  font-family: var(--font-mono); font-size: var(--fs-sm); font-weight: 500;
}
.step-body { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px 14px; }
.step-body h4 { margin: 2px 0 6px; font-size: var(--fs-lg); font-weight: 600; line-height: 1.45; }
.block { margin: 10px 0 0; padding: 8px 12px; border-radius: 7px; background: var(--lv-deep-bg); font-size: var(--fs-sm); display: flex; gap: 10px; }
.block b { flex: none; color: var(--lv-deep); font-weight: 600; }
.rel { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; font-size: var(--fs-xs); }
.rel > span { font-family: var(--font-mono); color: var(--muted); margin-right: 2px; }
.rel-link {
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px;
  color: var(--accent); text-decoration: none;
}
.rel-link:hover { border-color: var(--accent); }
.sheet { max-width: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; }
.sheet h3 { margin: 22px 0 8px; font-size: var(--fs-md); font-weight: 700; }
.sheet h3:first-child { margin-top: 0; }
.md.prompt { margin: -2px 0 12px; }

@media (max-width: 860px) {
  .modes { order: 2; margin-right: 0; }
  .toc { display: flex; flex-wrap: wrap; gap: 6px; }
  .toc-btn { border: 1px solid var(--line); background: var(--surface); padding: 4px 11px; border-radius: 999px; }
  .note-h h2 { font-size: 1.6rem; }
  .sheet { padding: 14px 14px; }
  .step-body { padding: 12px 14px; }
  .wrap { grid-template-columns: minmax(0, 1fr); gap: 20px; padding-block: 18px 48px; }
  aside { position: static; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .bar { position: static; }
  .q, .sec-h { scroll-margin-top: calc(env(safe-area-inset-top, 0px) + 12px); }
  .cats { display: flex; flex-wrap: wrap; gap: 6px; }
  .cat-btn { width: auto; border: 1px solid var(--line); background: var(--surface); grid-template-columns: auto auto; }
  .cat-btn .prog { display: none; }
  .legend { display: none; }
  .search { max-width: none; order: 3; flex-basis: 100%; }
  .search kbd { display: none; }
  .q { padding: 16px; }
}
@media (prefers-reduced-motion: reduce) { .q { transition: none; } }
</style>

<header class="bar">
  <div class="bar-inner">
    <div class="brand">
      <h1>딥러닝 면접 노트</h1>
      <span class="count" id="total-count"></span>
    </div>
    <nav class="modes" id="modes" role="tablist" aria-label="보기 전환">
      <button class="mode-btn" type="button" role="tab" data-mode="notes" aria-selected="true">개념 노트</button>
      <button class="mode-btn" type="button" role="tab" data-mode="qa" aria-selected="false">면접 질문</button>
    </nav>
    <label class="search" for="q-search">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="q-search" type="search" placeholder="질문, 태그, 답변 검색" autocomplete="off" aria-label="질문 검색">
      <kbd>/</kbd>
    </label>
    <div class="tools">
      <button class="btn primary" id="btn-random" type="button">랜덤 질문</button>
      <button class="btn" id="btn-expand" type="button" aria-pressed="false">답변 모두 펼치기</button>
    </div>
  </div>
</header>

<div class="wrap">
  <aside>
   <div class="side-group" id="side-notes" hidden>
    <section>
      <p class="side-h">노트</p>
      <div class="cats" id="note-cats"></div>
    </section>
    <section>
      <p class="side-h">바로 가기</p>
      <div class="toc" id="note-toc">
        <button class="toc-btn" type="button" data-sec="map">개념 지도</button>
        <button class="toc-btn" type="button" data-sec="sheet">한 장 요약</button>
        <button class="toc-btn" type="button" data-sec="checks">이해 확인</button>
      </div>
    </section>
    <section>
      <p class="side-h">문제 유형</p>
      <div class="chips" id="check-types"></div>
      <label class="check" for="hide-solved"><input type="checkbox" id="hide-solved"> 맞힌 문제 숨기기</label>
      <p class="legend">개념: 원리를 내 말로 설명 · 만약에: 조건을 바꾸면? · 생각해보기: 여러 개념을 엮어 추론 · 연결: 다른 주제와의 관계 · OX: 헷갈리는 문장 · 계산: 직접 숫자 넣기</p>
    </section>
   </div>
   <div class="side-group" id="side-qa">
    <section>
      <p class="side-h">주제</p>
      <div class="cats" id="cats"></div>
    </section>
    <section>
      <p class="side-h">질문 유형</p>
      <div class="chips" id="types"></div>
      <p class="legend">개념: ~란? · 비교: A와 B의 차이 · 이유: 왜 그렇게 하나 · 경험: 직접 해 본 실험으로 답하기</p>
    </section>
    <section>
      <p class="side-h">난이도</p>
      <div class="chips" id="levels"></div>
      <label class="check" for="hide-known"><input type="checkbox" id="hide-known"> 외운 질문 숨기기</label>
      <p class="legend">기본: 그 주제면 거의 반드시 묻는 것 · 심화: 원리와 트레이드오프까지 알아야 답할 수 있는 것</p>
    </section>
   </div>
  </aside>
  <main>
    <div class="status" id="status"></div>
    <div id="qa-view"><div id="list"><div class="empty">질문을 불러오는 중입니다.</div></div></div>
    <div id="notes-view" hidden></div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(() => {
  const LEVELS = ["기본", "심화"];
  const TYPES = ["개념", "비교", "이유", "경험"];
  const CHECK_TYPES = ["개념", "만약에", "생각해보기", "연결", "OX", "계산"];
  const KNOWN_KEY = "dl-interview.known";
  const EXPAND_KEY = "dl-interview.expand";
  const MODE_KEY = "dl-interview.mode";

  const state = {
    mode: "qa",
    groups: [], items: [],
    cat: "all", levels: new Set(LEVELS), types: new Set(TYPES), hideKnown: false, query: "",
    notes: [], checks: [], noteCur: null, checkTypes: new Set(CHECK_TYPES), hideSolved: false,
    expandAll: false,
    known: new Set(),
  };

  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const splitList = (s) => (s || "").split(",").map((t) => t.trim()).filter(Boolean);
  const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

  function load(key, fallback) { try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); } catch { return fallback; } }
  function save(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }

  function md(text) {
    const html = window.marked ? window.marked.parse(text || "", { gfm: true }) : "<p>" + esc(text || "") + "</p>";
    const box = document.createElement("div");
    box.innerHTML = html;
    box.querySelectorAll("table").forEach((t) => {
      const w = document.createElement("div"); w.className = "tablewrap";
      t.replaceWith(w); w.appendChild(t);
    });
    box.querySelectorAll("a").forEach((a) => { a.target = "_blank"; a.rel = "noopener"; });
    return box.innerHTML;
  }

  function splitLines(text) {
    return text.replace(/\r\n?/g, "\n").replace(/<!--[\s\S]*?-->/g, "").split("\n");
  }

  // ---------- parser: interview questions (one file = one category) ----------
  function parseFile(text, file) {
    const group = { file, title: file, meta: {}, questions: [] };
    let q = null, section = null, follow = null, inFence = false;
    for (const line of splitLines(text)) {
      const isFence = /^\s*(```|~~~)/.test(line);
      if (!inFence && !isFence) {
        let m;
        if (!q && (m = line.match(/^#\s+(.+)/))) { group.title = m[1].trim(); continue; }
        if ((m = line.match(/^##\s+Q\.\s*(.+)/))) {
          q = { question: m[1].trim(), meta: {}, sections: {}, follow: [] };
          group.questions.push(q); section = null; follow = null; continue;
        }
        if (q && (m = line.match(/^###\s+(.+)/))) { section = m[1].trim(); q.sections[section] = ""; follow = null; continue; }
        if (q && section === "꼬리질문" && (m = line.match(/^####\s+(.+)/))) { follow = { q: m[1].trim(), a: "" }; q.follow.push(follow); continue; }
        if (!section && (m = line.match(/^([a-z_]+):\s*(.*)$/))) { (q ? q.meta : group.meta)[m[1]] = m[2].trim(); continue; }
      }
      if (isFence) inFence = !inFence;
      if (q && section) {
        if (section === "꼬리질문") { if (follow) follow.a += line + "\n"; }
        else q.sections[section] += line + "\n";
      }
    }
    return group;
  }

  // ---------- parser: concept notes ----------
  function parseNote(text, file) {
    const slug = file.replace(/^.*\//, "").replace(/\.md$/, "").replace(/[^A-Za-z0-9-]/g, "-");
    const note = { file, slug, title: slug, meta: {}, map: [], summary: "", checks: [] };
    let sec = null, step = null, chk = null, part = null, inFence = false;
    for (const line of splitLines(text)) {
      const isFence = /^\s*(```|~~~)/.test(line);
      if (!inFence && !isFence) {
        let m;
        if (!sec && (m = line.match(/^#\s+(.+)/))) { note.title = m[1].trim(); continue; }
        if ((m = line.match(/^##\s+(.+)/))) { sec = m[1].trim(); step = null; chk = null; continue; }
        if (!sec && (m = line.match(/^([a-z_]+):\s*(.*)$/))) { note.meta[m[1]] = m[2].trim(); continue; }
        if (sec === "개념 지도") {
          if ((m = line.match(/^###\s+(.+)/))) { step = { title: m[1].trim(), related: [], key: "", body: "", problem: "" }; note.map.push(step); continue; }
          if (step && (m = line.match(/^related:\s*(.*)$/))) { step.related = splitList(m[1]); continue; }
          if (step && (m = line.match(/^막힌 점:\s*(.*)$/))) { step.problem = m[1].trim(); continue; }
          if (step && (m = line.match(/^핵심:\s*(.*)$/))) { step.key = m[1].trim(); continue; }
        }
        if (sec === "이해 확인") {
          if ((m = line.match(/^###\s+Q\.\s*(.+)/))) { chk = { question: m[1].trim(), meta: {}, body: "", answer: "" }; note.checks.push(chk); part = "meta"; continue; }
          if (chk && /^####\s+/.test(line)) { part = "answer"; continue; }
          if (chk && part === "meta" && (m = line.match(/^([a-z_]+):\s*(.*)$/))) { chk.meta[m[1]] = m[2].trim(); continue; }
        }
      }
      if (isFence) inFence = !inFence;
      if (sec === "개념 지도" && step) step.body += line + "\n";
      else if (sec === "한 장 요약") note.summary += line + "\n";
      else if (sec === "이해 확인" && chk) {
        if (part === "answer") chk.answer += line + "\n";
        else {
          if (part === "meta" && line.trim()) part = "body";
          if (part === "body") chk.body += line + "\n";
        }
      }
    }
    return note;
  }

  // ---------- shared card wiring ----------
  function setOpen(item, open) {
    item.answerEl.hidden = !open;
    const word = item.kind === "check" ? "풀이" : "답변";
    item.revealBtn.textContent = open ? `${word} 접기` : `${word} 보기`;
    item.revealBtn.setAttribute("aria-expanded", String(open));
  }

  function wireCard(item, el) {
    item.el = el;
    item.answerEl = $(".answer", el);
    item.revealBtn = $(".reveal", el);
    item.revealBtn.addEventListener("click", () => setOpen(item, item.answerEl.hidden));
    const box = $(".known-box", el);
    box.checked = state.known.has(item.id);
    el.classList.toggle("known", box.checked);
    box.addEventListener("change", () => {
      if (box.checked) state.known.add(item.id); else state.known.delete(item.id);
      el.classList.toggle("known", box.checked);
      save(KNOWN_KEY, [...state.known]);
      refresh();
    });
  }

  function qTitle(id) {
    const it = state.items.find((x) => x.id === id);
    return it ? it.q.question : id;
  }
  function relLinks(ids) {
    return ids.map((id) => `<a class="rel-link" href="#${esc(id)}" title="${esc(qTitle(id))}">${esc(qTitle(id))}</a>`).join("");
  }

  // ---------- render: interview questions ----------
  function renderCard(item) {
    const { q, group, no, level, type } = item;
    const extra = /^보충/.test(q.meta.source || "");
    const tags = splitList(q.meta.tags);
    const el = document.createElement("article");
    el.className = "q"; el.id = item.id;
    const extraSections = Object.keys(q.sections).filter((k) => !["30초 답변", "자세히", "꼬리질문"].includes(k));
    el.innerHTML = `
      <div class="q-meta">
        <span class="qno">Q${String(no).padStart(2, "0")}</span>
        <span class="ty ty-${type}">${type}</span>
        <span class="lv lv-${level}">${level}</span>
        ${extra ? `<span class="extra" title="블로그에 없는 내용을 보충한 질문">보충</span>` : ""}
        ${tags.length ? `<span class="tags">${tags.map((t) => "#" + esc(t)).join(" ")}</span>` : ""}
      </div>
      <h3 class="q-title">${esc(q.question)}</h3>
      <div class="q-actions">
        <button class="btn reveal" type="button" aria-expanded="false">답변 보기</button>
        <label class="known-toggle"><input type="checkbox" class="known-box" id="known-${item.id}"> 외웠음</label>
        <a class="link" href="#${item.id}" title="이 질문 링크">#${esc(item.id)}</a>
      </div>
      <div class="answer" hidden>
        ${q.sections["30초 답변"] ? `<section class="short"><h3>30초 답변</h3><div class="md">${md(q.sections["30초 답변"])}</div></section>` : ""}
        ${q.sections["자세히"] && q.sections["자세히"].trim() ? `<section><h3>자세히</h3><div class="md">${md(q.sections["자세히"])}</div></section>` : ""}
        ${extraSections.map((k) => `<section><h3>${esc(k)}</h3><div class="md">${md(q.sections[k])}</div></section>`).join("")}
        ${q.follow.length ? `<section class="follow"><h3>꼬리질문 ${q.follow.length}</h3>${q.follow.map((f) => `<details><summary>${esc(f.q)}</summary><div class="md">${md(f.a)}</div></details>`).join("")}</section>` : ""}
        <p class="src">${extra
          ? `출처: 블로그 밖 내용 (면접 빈출 주제로 보충) · 관련 글 <code>${esc(group.meta.blog || "")}</code>`
          : `출처: ${esc(group.meta.blog_title || group.title)}${q.meta.source ? " › " + esc(q.meta.source) : ""}${group.meta.blog ? ` · <code>${esc(group.meta.blog)}</code>` : ""}`}</p>
      </div>`;
    wireCard(item, el);
    item.haystack = [q.question, q.meta.tags, ...Object.values(q.sections), ...q.follow.map((f) => f.q + " " + f.a)].join(" ").toLowerCase();
    return el;
  }

  function renderAll() {
    const list = $("#list");
    list.innerHTML = "";
    for (const g of state.groups) {
      const head = document.createElement("div");
      head.className = "group-h"; head.dataset.group = g.file;
      head.innerHTML = `<h2>${esc(g.title)}</h2><span class="src">${g.questions.length}문항${g.meta.blog ? ` · <code>${esc(g.meta.blog)}</code>` : ""}</span>`;
      const box = document.createElement("div");
      box.className = "list"; box.dataset.group = g.file;
      g.items.forEach((it) => box.appendChild(renderCard(it)));
      list.append(head, box);
    }
    const empty = document.createElement("div");
    empty.className = "empty"; empty.id = "no-results"; empty.hidden = true;
    empty.textContent = "조건에 맞는 질문이 없습니다. 검색어나 필터를 바꿔 보세요.";
    list.appendChild(empty);
  }

  function catButton(key, title, items, pressed, attr) {
    const known = items.filter((it) => state.known.has(it.id)).length;
    const pct = items.length ? Math.round((known / items.length) * 100) : 0;
    return `<button class="cat-btn" type="button" ${attr}="${esc(key)}" aria-pressed="${pressed}">
      <span>${esc(title)}</span><span class="n">${known}/${items.length}</span>
      <span class="prog" aria-hidden="true"><i style="width:${pct}%"></i></span></button>`;
  }

  function renderSidebar() {
    const cats = $("#cats");
    const entries = [{ file: "all", title: "전체", items: state.items }, ...state.groups];
    cats.innerHTML = entries.map((g) => catButton(g.file, g.title, g.items, state.cat === g.file, "data-cat")).join("");
    cats.querySelectorAll(".cat-btn").forEach((b) => b.addEventListener("click", () => { state.cat = b.dataset.cat; applyFilters(); }));
  }

  function visibleItems() {
    const words = state.query.toLowerCase().split(/\s+/).filter(Boolean);
    return state.items.filter((it) =>
      (state.cat === "all" || it.group.file === state.cat) &&
      state.levels.has(it.level) &&
      state.types.has(it.type) &&
      !(state.hideKnown && state.known.has(it.id)) &&
      words.every((w) => it.haystack.includes(w)));
  }

  function applyFilters() {
    const vis = new Set(visibleItems());
    state.items.forEach((it) => { it.el.hidden = !vis.has(it); });
    document.querySelectorAll("#list .group-h, #list .list").forEach((el) => {
      el.hidden = !state.items.some((it) => it.group.file === el.dataset.group && vis.has(it));
    });
    $("#no-results").hidden = vis.size > 0;
    const known = state.items.filter((it) => state.known.has(it.id)).length;
    $("#status").innerHTML = `<span>${state.items.length}문항 중 ${vis.size}문항 표시</span><span>외운 질문 ${known} / ${state.items.length}</span>`;
    renderSidebar();
  }

  // ---------- render: concept notes ----------
  function renderCheck(item) {
    const { q, no, level, type } = item;
    const el = document.createElement("article");
    el.className = "q chk"; el.id = item.id;
    el.innerHTML = `
      <div class="q-meta">
        <span class="qno">C${String(no).padStart(2, "0")}</span>
        <span class="ty ty-${esc(type)}">${esc(type)}</span>
        <span class="lv lv-${level}">${level}</span>
      </div>
      <h3 class="q-title">${esc(q.question)}</h3>
      ${q.body.trim() ? `<div class="md prompt">${md(q.body)}</div>` : ""}
      <div class="q-actions">
        <button class="btn reveal" type="button" aria-expanded="false">풀이 보기</button>
        <label class="known-toggle"><input type="checkbox" class="known-box" id="known-${item.id}"> 맞힘</label>
        <a class="link" href="#${item.id}" title="이 문제 링크">#${esc(item.id)}</a>
      </div>
      <div class="answer" hidden>
        <section><h3>풀이</h3><div class="md">${md(q.answer)}</div></section>
        ${item.related.length ? `<div class="rel"><span>관련 면접 질문</span>${relLinks(item.related)}</div>` : ""}
      </div>`;
    wireCard(item, el);
    return el;
  }

  function renderNotes() {
    const view = $("#notes-view");
    view.innerHTML = "";
    for (const n of state.notes) {
      const art = document.createElement("article");
      art.className = "note"; art.dataset.note = n.slug; art.id = "note-" + n.slug;
      art.innerHTML = `
        <header class="note-h">
          <p class="eyebrow">개념 노트</p>
          <h2>${esc(n.title)}</h2>
          ${n.meta.summary ? `<p class="lede">${esc(n.meta.summary)}</p>` : ""}
          ${n.meta.blog ? `<p class="src">${esc(n.meta.blog_title || "")} · <code>${esc(n.meta.blog)}</code></p>` : ""}
        </header>
        <section data-sec="map">
          <h3 class="sec-h">개념 지도 <span>${n.map.length}단계 · 앞 단계에서 막힌 점을 다음 단계가 풉니다</span></h3>
          <ol class="flow">${n.map.map((s, i) => `
            <li class="step">
              <span class="step-no">${i + 1}</span>
              <div class="step-body">
                <h4>${esc(s.title)}</h4>
                ${s.key ? `<p class="key">${esc(s.key)}</p>` : ""}
                <div class="md">${md(s.body)}</div>
                ${s.problem ? `<p class="block"><b>막힌 점</b><span>${esc(s.problem)}</span></p>` : ""}
                ${s.related.length ? `<div class="rel"><span>면접 질문</span>${relLinks(s.related)}</div>` : ""}
              </div>
            </li>`).join("")}</ol>
        </section>
        <section data-sec="sheet">
          <h3 class="sec-h">한 장 요약 <span>공식, 헷갈리는 용어, 연표</span></h3>
          <div class="md sheet">${md(n.summary)}</div>
        </section>
        <section data-sec="checks">
          <h3 class="sec-h">이해 확인 <span>답을 먼저 떠올리거나 써 본 다음 풀이를 펼치세요</span></h3>
          <div class="list checks"></div>
          <div class="empty" hidden>조건에 맞는 문제가 없습니다.</div>
        </section>`;
      const list = $(".checks", art);
      n.items.forEach((it) => list.appendChild(renderCheck(it)));
      view.appendChild(art);
    }
  }

  function renderNoteSidebar() {
    const cats = $("#note-cats");
    cats.innerHTML = state.notes.map((n) => catButton(n.slug, n.title, n.items, state.noteCur === n.slug, "data-note")).join("");
    cats.querySelectorAll(".cat-btn").forEach((b) => b.addEventListener("click", () => {
      state.noteCur = b.dataset.note; applyNoteFilters();
      window.scrollTo({ top: 0, behavior: reduceMotion() ? "auto" : "smooth" });
    }));
  }

  function applyNoteFilters() {
    const cur = state.noteCur;
    document.querySelectorAll("#notes-view .note").forEach((a) => { a.hidden = a.dataset.note !== cur; });
    const curChecks = state.checks.filter((it) => it.note.slug === cur);
    let shown = 0;
    curChecks.forEach((it) => {
      const vis = state.checkTypes.has(it.type) && !(state.hideSolved && state.known.has(it.id));
      it.el.hidden = !vis;
      if (vis) shown++;
    });
    const art = document.querySelector(`#notes-view .note[data-note="${cur}"]`);
    if (art) $("[data-sec=checks] .empty", art).hidden = shown > 0;
    const solved = curChecks.filter((it) => state.known.has(it.id)).length;
    $("#status").innerHTML = `<span>이해 확인 ${curChecks.length}문제 중 ${shown}문제 표시</span><span>맞힌 문제 ${solved} / ${curChecks.length}</span>`;
    renderNoteSidebar();
  }

  function refresh() { if (state.mode === "qa") applyFilters(); else applyNoteFilters(); }

  // ---------- mode ----------
  function setMode(mode) {
    if (mode === "notes" && !state.notes.length) mode = "qa";
    state.mode = mode;
    save(MODE_KEY, mode);
    document.querySelectorAll(".mode-btn").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.mode === mode)));
    $("#qa-view").hidden = mode !== "qa";
    $("#notes-view").hidden = mode !== "notes";
    $("#side-qa").hidden = mode !== "qa";
    $("#side-notes").hidden = mode !== "notes";
    $(".search").hidden = mode !== "qa";
    $("#btn-random").textContent = mode === "qa" ? "랜덤 질문" : "랜덤 문제";
    $("#total-count").textContent = mode === "qa"
      ? `${state.groups.length}개 주제 · ${state.items.length}문항`
      : `${state.notes.length}개 노트 · ${state.checks.length}문제`;
    syncExpand();
    refresh();
  }

  // ---------- navigation ----------
  function flash(item) {
    item.el.classList.add("flash");
    setTimeout(() => item.el.classList.remove("flash"), 900);
  }

  function resetQaFilters() {
    state.cat = "all"; state.query = ""; $("#q-search").value = "";
    state.levels = new Set(LEVELS); state.types = new Set(TYPES);
    state.hideKnown = false; $("#hide-known").checked = false;
    syncChips();
  }

  function goTo(id, { open = false } = {}) {
    if (!id) return;
    if (id.startsWith("note-")) {
      const slug = id.slice(5);
      if (state.notes.some((n) => n.slug === slug)) { state.noteCur = slug; setMode("notes"); window.scrollTo(0, 0); }
      return;
    }
    let item = state.items.find((it) => it.id === id);
    let jump = false;
    if (item) {
      if (state.mode !== "qa") { setMode("qa"); jump = true; }
      if (item.el.hidden) { resetQaFilters(); applyFilters(); jump = true; }
    } else {
      item = state.checks.find((it) => it.id === id);
      if (!item) return;
      if (state.noteCur !== item.note.slug) jump = true;
      state.noteCur = item.note.slug;
      if (state.mode !== "notes") { setMode("notes"); jump = true; } else applyNoteFilters();
      if (item.el.hidden) {
        state.checkTypes = new Set(CHECK_TYPES); state.hideSolved = false; $("#hide-solved").checked = false;
        syncChips(); applyNoteFilters();
      }
    }
    if (open) setOpen(item, true);
    item.el.scrollIntoView({ behavior: "auto", block: "start" });
    flash(item);
  }

  // ---------- chips ----------
  function syncChips() {
    document.querySelectorAll("#levels .chip").forEach((c) => c.setAttribute("aria-pressed", String(state.levels.has(c.dataset.v))));
    document.querySelectorAll("#types .chip").forEach((c) => c.setAttribute("aria-pressed", String(state.types.has(c.dataset.v))));
    document.querySelectorAll("#check-types .chip").forEach((c) => c.setAttribute("aria-pressed", String(state.checkTypes.has(c.dataset.v))));
  }

  function buildChips(box, values, list, key, cls, getSet) {
    box.innerHTML = values.map((v) => {
      const n = list.filter((it) => it[key] === v).length;
      return `<button class="chip ${cls}-${v}" type="button" data-v="${v}" aria-pressed="true">${v}<span class="n">${n}</span></button>`;
    }).join("");
    box.querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => {
      const s = getSet();
      const v = c.dataset.v;
      if (s.has(v)) { if (s.size > 1) s.delete(v); } else s.add(v);
      syncChips(); refresh();
    }));
  }

  function syncExpand() {
    const btn = $("#btn-expand");
    const word = state.mode === "qa" ? "답변" : "풀이";
    btn.textContent = state.expandAll ? `${word} 모두 접기` : `${word} 모두 펼치기`;
    btn.setAttribute("aria-pressed", String(state.expandAll));
  }

  // ---------- controls ----------
  function wireControls() {
    buildChips($("#types"), TYPES, state.items, "type", "ty", () => state.types);
    buildChips($("#levels"), LEVELS, state.items, "level", "lv", () => state.levels);
    buildChips($("#check-types"), CHECK_TYPES, state.checks, "type", "ty", () => state.checkTypes);
    $("#hide-known").addEventListener("change", (e) => { state.hideKnown = e.target.checked; applyFilters(); });
    $("#hide-solved").addEventListener("change", (e) => { state.hideSolved = e.target.checked; applyNoteFilters(); });
    $("#q-search").addEventListener("input", (e) => { state.query = e.target.value; applyFilters(); });
    document.querySelectorAll(".mode-btn").forEach((b) => b.addEventListener("click", () => { setMode(b.dataset.mode); window.scrollTo(0, 0); }));
    document.querySelectorAll(".toc-btn").forEach((b) => b.addEventListener("click", () => {
      const sec = document.querySelector(`#notes-view .note[data-note="${state.noteCur}"] [data-sec="${b.dataset.sec}"] .sec-h`);
      if (sec) sec.scrollIntoView({ behavior: "auto", block: "start" });
    }));
    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && state.mode === "qa" && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) { e.preventDefault(); $("#q-search").focus(); }
      if (e.key === "Escape" && document.activeElement === $("#q-search")) { $("#q-search").value = ""; state.query = ""; applyFilters(); }
    });
    document.addEventListener("click", (e) => {
      const a = e.target.closest('a[href^="#"]');
      if (!a) return;
      const id = decodeURIComponent(a.getAttribute("href").slice(1));
      e.preventDefault();
      goTo(id, { open: a.classList.contains("rel-link") });
      try { history.replaceState(null, "", "#" + id); } catch {}
    });
    $("#btn-expand").addEventListener("click", () => {
      state.expandAll = !state.expandAll; save(EXPAND_KEY, state.expandAll);
      [...state.items, ...state.checks].forEach((it) => setOpen(it, state.expandAll));
      syncExpand();
    });
    state.expandAll = !!load(EXPAND_KEY, false);
    if (state.expandAll) [...state.items, ...state.checks].forEach((it) => setOpen(it, true));
    $("#btn-random").addEventListener("click", () => {
      const pool = state.mode === "qa"
        ? visibleItems()
        : state.checks.filter((it) => !it.el.hidden);
      const fresh = pool.filter((it) => !state.known.has(it.id));
      const from = fresh.length ? fresh : pool;
      if (!from.length) return;
      const pick = from[Math.floor(Math.random() * from.length)];
      if (!state.expandAll) setOpen(pick, false);
      goTo(pick.id);
    });
    window.addEventListener("hashchange", () => goTo(decodeURIComponent(location.hash.slice(1))));
  }

  // ---------- boot ----------
  async function fetchTexts(paths) {
    const settled = await Promise.allSettled(paths.map((p) =>
      fetch(p, { cache: "no-cache" }).then((r) => { if (!r.ok) throw new Error(p + " " + r.status); return r.text(); })));
    return settled.map((s, i) => {
      if (s.status !== "fulfilled") console.warn("파일을 불러오지 못함:", paths[i]);
      return { path: paths[i], text: s.status === "fulfilled" ? s.value : null };
    });
  }

  async function boot() {
    state.known = new Set(load(KNOWN_KEY, []));
    let manifest;
    try {
      manifest = await fetch("questions/manifest.json", { cache: "no-cache" }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });
      const loaded = await fetchTexts(manifest.files.map((f) => "questions/" + f));
      if (!loaded.some((x) => x.text != null)) throw new Error("불러온 파일 없음");
      let no = 0;
      const seen = new Set();
      state.groups = loaded.filter((x) => x.text != null).map(({ path, text }) => {
        const g = parseFile(text, path.replace(/^questions\//, ""));
        g.items = g.questions.map((q, j) => {
          let id = (q.meta.id || `${g.file.replace(/\.md$/, "")}-${j + 1}`).replace(/[^A-Za-z0-9-]/g, "-");
          while (seen.has(id)) id += "-x";
          seen.add(id);
          const type = TYPES.includes(q.meta.type) ? q.meta.type : (q.meta.level === "경험" ? "경험" : "개념");
          const level = LEVELS.includes(q.meta.level) ? q.meta.level : "기본";
          return { kind: "qa", id, q, group: g, no: ++no, level, type };
        });
        return g;
      });
      state.items = state.groups.flatMap((g) => g.items);

      const noteFiles = manifest.notes || [];
      const notesLoaded = await fetchTexts(noteFiles);
      let cno = 0;
      state.notes = notesLoaded.filter((x) => x.text != null).map(({ path, text }) => {
        const n = parseNote(text, path);
        n.items = n.checks.map((q, j) => {
          let id = (q.meta.id || `${n.slug}-c${j + 1}`).replace(/[^A-Za-z0-9-]/g, "-");
          while (seen.has(id)) id += "-x";
          seen.add(id);
          const type = CHECK_TYPES.includes(q.meta.type) ? q.meta.type : "개념";
          const level = LEVELS.includes(q.meta.level) ? q.meta.level : "기본";
          return { kind: "check", id, q, note: n, no: ++cno, level, type, related: splitList(q.meta.related) };
        });
        return n;
      });
      state.checks = state.notes.flatMap((n) => n.items);
      state.noteCur = state.notes[0] ? state.notes[0].slug : null;
    } catch (err) {
      $("#list").innerHTML = `<div class="error">질문 파일을 불러오지 못했습니다 (${esc(err.message)}).<br>로컬에서 볼 때는 <code>interview_qa</code> 폴더에서 <code>python -m http.server</code>로 서버를 띄워 여세요.</div>`;
      return;
    }
    $("#modes").hidden = !state.notes.length;
    renderAll();
    renderNotes();
    wireControls();
    setMode(load(MODE_KEY, "notes"));
    if (location.hash) goTo(decodeURIComponent(location.hash.slice(1)));
  }
  boot();
})();
</script>
